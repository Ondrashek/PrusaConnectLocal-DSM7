<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prusa Connect Local</title>
</head>
<body>
<p>Opening Prusa Connect Local… / Otevírám Prusa Connect Local…</p>
<p><a id="open">Open / Otevřít</a></p>
<script>
'use strict';
const target = new URL(window.location.href);
target.protocol = 'https:';
target.port = '18443';
target.pathname = '/';
target.search = '';
target.hash = '';
document.getElementById('open').href = target.href;
window.location.replace(target.href);
</script>
</body>
</html>
