name: Build experimental DSM7 package
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install icon build dependency
        run: python -m pip install -r requirements-build.txt
      - name: Validate source and icons
        run: python tools/test_source.py
      - name: Resolve pinned YAML dependency
        run: go mod tidy
      - name: Test wrapper and migration
        run: go test -race ./...
      - name: Build static wrapper
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o build/pcl-wrapper ./cmd/pcl-wrapper
      - name: Download official upstream release and verify checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/upstream
          gh release download v0.1.0-beta.1 --repo prusa3d/prusa-connect --pattern prusa_connect_amd64 --pattern SHA256SUMS --dir build/upstream
          cd build/upstream
          grep -E ' [*]?prusa_connect_amd64$' SHA256SUMS > selected.sha256
          test "$(wc -l < selected.sha256)" -eq 1
          sha256sum -c selected.sha256
      - name: Fetch upstream license
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/prusa3d/prusa-connect/contents/LICENSE?ref=v0.1.0-beta.1" --jq .content | base64 --decode > build/upstream/LICENSE
      - name: Assemble SPK
        run: python tools/build_spk.py --wrapper build/pcl-wrapper --upstream build/upstream/prusa_connect_amd64 --output build/PrusaConnectLocal-geminilake-0.1.0-0005.spk
      - name: Validate archive
        run: python tools/test_package.py build/PrusaConnectLocal-geminilake-0.1.0-0005.spk
      - uses: actions/upload-artifact@v4
        with:
          name: PrusaConnectLocal-DSM7-experimental-v5
          path: |
            build/*.spk
            build/*.sha256
